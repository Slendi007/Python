[project]
name = "first-proyectproety"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic (>=2.13.5,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "sqlalchemy (>=2.0.54,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.53.0,<0.54.0)",
    "pyjwt (>=2.14.0,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pandas (>=3.0.6,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "joblib (>=1.6.0,<2.0.0)",
    "typer (>=0.27.2,<0.28.0)"
]

[project.scripts]
orders = "first_proyectproety.cli_automatizacion.cli:main"

[tool.poetry]
packages = [{include = "first_proyectproety", from = "src"}]


[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E","F","I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "ruff (>=0.16.6,<0.17.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "hypothesis (>=6.168.0,<7.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)"
]
